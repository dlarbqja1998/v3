		<style>
			#app-launch-splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				background: #ffffff;
				animation: app-launch-splash-exit 800ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
			}

			#app-launch-splash img {
				width: clamp(144px, 46vw, 224px);
				height: auto;
				object-fit: contain;
				animation: app-launch-icon-grow 800ms cubic-bezier(0.22, 1, 0.36, 1) both;
			}

			@keyframes app-launch-icon-grow {
				from {
					transform: scale(0.7);
					opacity: 0.82;
				}
				72%,
				to {
					transform: scale(1);
					opacity: 1;
				}
			}

			@keyframes app-launch-splash-exit {
				0%,
				72% {
					opacity: 1;
				}
				to {
					opacity: 0;
					visibility: hidden;
					pointer-events: none;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				#app-launch-splash {
					animation-duration: 200ms;
				}

	<body data-sveltekit-preload-data="hover">

		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(() => {
				const splash = document.getElementById('app-launch-splash');
				if (!splash) return;

				let fallbackTimer;
				const removeSplash = () => {
					splash.remove();
					window.clearTimeout(fallbackTimer);
				};

				splash.addEventListener('animationend', (event) => {
					if (event.target === splash) removeSplash();
				});
				fallbackTimer = window.setTimeout(removeSplash, 1200);
			})();
		</script>
